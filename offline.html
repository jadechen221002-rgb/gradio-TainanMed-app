<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <title>目前離線 | 台南開放資料檢視器</title>
  <style>
    :root { --bg:#f0fdfa; --fg:#0f172a; --muted:#64748b; --brand:#0d9488; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1f1d; --fg:#e2e8f0; --muted:#94a3b8; --brand:#2dd4bf; }
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:var(--bg); color:var(--fg);
      font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center;
    }
    main { max-width:380px; }
    .icon { font-size:56px; }
    h1 { font-size:1.5rem; margin:12px 0 8px; }
    p { color:var(--muted); line-height:1.7; margin:0 0 24px; }
    button {
      background:var(--brand); color:#fff; border:0; border-radius:12px;
      padding:12px 28px; font-size:1rem; cursor:pointer;
    }
    @media (prefers-color-scheme: dark) { button { color:#042f2e; } }
  </style>
</head>
<body>
  <main>
    <div class="icon">📡</div>
    <h1>目前沒有網路連線</h1>
    <p>資料需要連線後才能載入。<br>請確認網路狀態後再試一次。</p>
    <button onclick="location.reload()">重新連線</button>
  </main>
</body>
</html>
